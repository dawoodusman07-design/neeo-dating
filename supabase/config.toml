# Supabase CLI config (`supabase start` for local dev). See supabase/README.md.
project_id = "neeo"

[auth]
enable_signup = true
site_url = "neeo://"

[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "30s"
otp_length = 6
otp_expiry = 300

# App Review test number / code: NEVER committed here. Set it only in the hosted
# Supabase dashboard (Authentication → Providers → Phone → Test phone numbers),
# rotate it after each review, then remove it. See README → "App Review test account".

[storage]
file_size_limit = "10MiB"
