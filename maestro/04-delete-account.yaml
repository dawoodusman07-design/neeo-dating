# Critical path 3: delete account (reauthenticate → explain → confirm → done)
appId: app.neeo.dev
---
- launchApp: { clearState: true }
- tapOn: { id: "create-account" }
- tapOn: { id: "phone-input" }
- inputText: "+15555550199"
- tapOn: { id: "send-code" }
- tapOn: { id: "otp-input" }
- inputText: "123456"
- tapOn: "You"
- tapOn: "Settings"
- scrollUntilVisible: { element: "Delete account" }
- tapOn: "Delete account"
- assertVisible: "Before you leave"
- tapOn: { id: "delete-continue" }
- tapOn: { id: "reauth-otp" }
- inputText: "123456"
- tapOn: { id: "reauth-verify" }
- tapOn: { id: "delete-confirm" }
- inputText: "DELETE"
- tapOn: { id: "delete-final" }
- assertVisible: "Your profile is removed"
- tapOn: "Back to welcome"
- assertVisible: "Make room for something real."
