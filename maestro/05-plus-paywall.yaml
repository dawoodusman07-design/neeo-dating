# Paywall: comparison table, plan choice, purchase states, restore.
appId: app.neeo.dev
---
- launchApp: { clearState: true }
- tapOn: { id: "create-account" }
- tapOn: { id: "phone-input" }
- inputText: "+15555550199"
- tapOn: { id: "send-code" }
- tapOn: { id: "otp-input" }
- inputText: "123456"
# Seeing who liked you is free: the Likes tab shows names and comments without Plus
- tapOn: "Likes"
- assertVisible: "Lena, 29"
- tapOn: "You"
- tapOn: "Neeo Plus"
- assertVisible: "A little more convenience"
- tapOn: { id: "plus-compare" }
- tapOn: { id: "plus-review" }
- assertVisible: "Auto-renews until cancelled. No trial."
- tapOn: { id: "plus-continue" }
- assertVisible: "Welcome to Neeo Plus"
- tapOn: "Explore Plus"
- assertVisible: "You are on Neeo Plus"
